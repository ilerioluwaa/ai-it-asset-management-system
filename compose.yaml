
services:

  # MySQL database service

  database:

    image: mysql:8.4

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_NAME:-assetmanagement}
      MYSQL_USER: ${DB_USERNAME:-assetadmin}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Database password is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MySQL root password is required}

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - backend-network

    healthcheck:
      test:
        - CMD-SHELL
        - mysql --user="$${MYSQL_USER}" --password="$${MYSQL_PASSWORD}" --database="$${MYSQL_DATABASE}" --execute="SELECT 1" > /dev/null 2>&1

      interval: 10s

      timeout: 5s

      retries: 15

      start_period: 30s


  # Spring Boot application service

  application:

    build:
      context: .
      dockerfile: Dockerfile

    image: ai-it-asset-management-system:1.0.0

    restart: unless-stopped

    depends_on:
      database:
        condition: service_healthy

    ports:
      - "127.0.0.1:${PORT:-8080}:8080"

    environment:

      # Application configuration

      PORT: "8080"

      # Database configuration

      DB_URL: jdbc:mysql://database:3306/${DB_NAME:-assetmanagement}

      DB_USERNAME: ${DB_USERNAME:-assetadmin}

      DB_PASSWORD: ${DB_PASSWORD:?Database password is required}

      # Administrator configuration

      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}

      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Administrator password is required}

      COOKIE_SECURE: ${COOKIE_SECURE:-false}

      # AI provider configuration

      AI_ENABLED: ${AI_ENABLED:-false}

      AI_API_KEY: ${AI_API_KEY:-}

      AI_MODEL: ${AI_MODEL:-}

      AI_BASE_URL: ${AI_BASE_URL:-}

    networks:
      - frontend-network
      - backend-network


# Persistent database storage

volumes:

  mysql-data:

    driver: local


# Application network configuration

networks:

  frontend-network:

    driver: bridge

  backend-network:

    driver: bridge

    internal: true
