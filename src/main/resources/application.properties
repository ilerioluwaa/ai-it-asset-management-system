# Application configuration
spring.application.name=assetmanagement
server.port=${PORT:8080}

# MySQL database configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/assetmanagement}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Database connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA and Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Error handling and information protection
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Session security
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Administrator credentials
app.security.admin.username=${ADMIN_USERNAME:admin}
app.security.admin.password=${ADMIN_PASSWORD}

# Application monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Application information
info.app.name=AI IT Asset Management System
info.app.version=1.0.0
info.app.course=CMSC 495 Computer Capstone Project

# Logging configuration
logging.level.root=INFO
logging.level.com.cmsc495.assetmanagement=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# AI provider configuration
app.ai.enabled=${AI_ENABLED:false}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:}
app.ai.base-url=${AI_BASE_URL:}
