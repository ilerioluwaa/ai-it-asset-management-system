
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Asset Management Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <header class="bg-dark text-white p-3">
        <h3>AI IT Asset Management System</h3>
        <p class="mb-0">CMSC 495 Capstone Project</p>
    </header>

    <main class="container mt-4">

        <h2>Asset Dashboard</h2>
        <p>Manage and monitor organizational IT assets.</p>

        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card p-3">
                    <h5>Total Assets</h5>
                    <h2 id="totalAssets">0</h2>
                </div>
            </div>
        </div>

        <div class="card p-4 mb-4">
            <h4>Register New Asset</h4>

            <form id="assetForm">
                <input class="form-control mb-2"
                       id="assetName"
                       placeholder="Asset Name"
                       required>

                <input class="form-control mb-2"
                       id="assetCategory"
                       placeholder="Category"
                       required>

                <input class="form-control mb-2"
                       id="serialNumber"
                       placeholder="Serial Number"
                       required>

                <select class="form-select mb-3" id="assetStatus">
                    <option value="Available">Available</option>
                    <option value="Assigned">Assigned</option>
                    <option value="Maintenance">Maintenance</option>
                </select>

                <button class="btn btn-primary" type="submit">
                    Add Asset
                </button>
                <button
                    id="cancelEditButton"
                    class="btn btn-secondary ms-2"
                    type="button"
                    hidden>
                    Cancel Edit
                </button>
            </form>
        </div>

        <div class="card p-4">
            <h4>Asset Inventory</h4>

            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Serial Number</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="assetTable"></tbody>
                </table>
            </div>
        </div>

        <p id="message" class="mt-3" role="status"></p>

    </main>

    <script src="/script.js"></script>
</body>
</html>
