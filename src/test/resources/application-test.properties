
# ==================================================
# AI IT Asset Management System
# CMSC 495 Capstone Project
# Automated Testing Configuration
# ==================================================

# Application configuration
spring.application.name=assetmanagement-test

# Isolated H2 in-memory database
spring.datasource.url=jdbc:h2:mem:asset_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Database connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# JPA and Hibernate configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Disable development tools during testing
spring.devtools.restart.enabled=false

# Test administrator credentials
# These credentials are exclusively for automated tests.
app.security.admin.username=testadmin
app.security.admin.password=TestAdmin123!

# Session configuration
server.servlet.session.cookie.secure=false

# Error handling
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Disable external AI requests during automated testing
app.ai.enabled=false
app.ai.api-key=
app.ai.model=
app.ai.base-url=

# Application monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Testing logs
logging.level.root=WARN
logging.level.com.cmsc495.assetmanagement=INFO
logging.level.org.springframework.test=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN
